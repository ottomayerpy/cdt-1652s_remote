# home/orangepi

[[protocols]]
name = "CDT-1652S"
protocol = "nec"

[protocols.scancodes]
# Управление питанием
0x59 = "KEY_POWER"
0x19 = "KEY_MUTE"

# Медиа-кнопки
0x48 = "KEY_PLAYPAUSE"
0x08 = "KEY_STOP"
0x0b = "KEY_RECORD"
0x55 = "KEY_INFO"
0x42 = "KEY_TV"
0x40 = "KEY_MEDIA"
0x00 = "KEY_AUDIO"
0x03 = "KEY_PROGRAM" # Синяя "Расп"
0x05 = "KEY_EPG"     # Телегид

# Навигация и меню
0x45 = "KEY_MENU"
0x15 = "KEY_EXIT"
0x11 = "KEY_BACK"
0x5a = "KEY_LEFT"
0x1b = "KEY_RIGHT"
0x06 = "KEY_UP"
0x16 = "KEY_DOWN"
0x1a = "KEY_OK"

# Дополнительные
0x0e = "KEY_FAVORITES"
0x13 = "KEY_PROG1"     # Кнопка USB
0x0d = "KEY_SUBTITLE"
0x12 = "KEY_TEXT"

# Цифры
0x0f = "KEY_0"
0x52 = "KEY_1"
0x50 = "KEY_2"
0x10 = "KEY_3"
0x56 = "KEY_4"
0x54 = "KEY_5"
0x14 = "KEY_6"
0x4e = "KEY_7"
0x4c = "KEY_8"
0x0c = "KEY_9"

# Перемотка
0x46 = "KEY_REWIND"
0x44 = "KEY_FASTFORWARD"
0x04 = "KEY_PREVIOUS"
0x07 = "KEY_NEXT"
